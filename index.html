<title>Ninja Sales Terminal</title>
<script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>

<style>
:root{
  --bg:#080600; --panel:#0d0900; --amber:#ffb000; --bright:#ffd36a;
  --dim:#9a6900; --line:#6f4b00; --danger:#ff8a00; --shadow:rgba(255,176,0,.22);
}
*{box-sizing:border-box}
html,body,#root{margin:0;min-height:100%;background:var(--bg);color:var(--amber)}
body{padding-left:env(safe-area-inset-left);padding-right:env(safe-area-inset-right);font-family:Arial,Helvetica,sans-serif;letter-spacing:.01em}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.app{min-height:100vh;max-width:780px;margin:auto;padding:14px 14px 92px;position:relative}
.crt:before{content:"";position:fixed;inset:0;pointer-events:none;z-index:50;
 background:repeating-linear-gradient(to bottom,rgba(255,176,0,.025) 0,rgba(255,176,0,.025) 1px,transparent 2px,transparent 4px)}
.crt:after{content:"";position:fixed;inset:0;pointer-events:none;z-index:49;
 box-shadow:inset 0 0 80px rgba(0,0,0,.85)}
header{border:1px solid var(--line);padding:12px;margin-bottom:12px;box-shadow:0 0 14px var(--shadow)}
.brand{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.brand strong{color:var(--bright);text-shadow:0 0 8px var(--shadow)}
.small{font-size:12px;color:var(--dim)}
.cursor{animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:10px 0 14px}
.stat,.card,.section{border:1px solid var(--line);background:rgba(255,176,0,.025)}
.stat{padding:9px;text-align:center}
.stat b{display:block;color:var(--bright);font-size:18px}
.section{padding:12px;margin:10px 0}
.section-title{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;color:var(--bright)}
.hoy-section>.section-title{margin-bottom:0;cursor:pointer;user-select:none;padding:2px 0}.hoy-section.open>.section-title{margin-bottom:10px}.hoy-section>.section-title:hover{color:var(--amber)}.hoy-section .section-chevron{display:inline-block;width:18px}.hoy-section-count{margin-left:auto;padding-left:12px}
.card{padding:11px;margin:8px 0}
.row{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.title{color:var(--bright);font-weight:bold}
.meta{font-size:12px;color:var(--dim);margin-top:4px;line-height:1.45}
.tag{display:inline-block;border:1px solid var(--line);padding:2px 6px;margin:5px 5px 0 0;font-size:11px}
.actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}
.btn{background:transparent;color:var(--amber);border:1px solid var(--amber);padding:8px 10px;text-transform:uppercase}
.btn:hover,.btn.primary{background:var(--amber);color:#120b00}
.btn.dim{border-color:var(--line);color:var(--dim)}
.btn.danger{border-color:var(--danger);color:var(--danger)}
.nav{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:min(780px,100%);display:grid;
 grid-template-columns:repeat(7,1fr);background:#090600;border-top:1px solid var(--amber);z-index:30;padding-bottom:env(safe-area-inset-bottom)}
.nav button{border:0;border-right:1px solid var(--line);background:transparent;color:var(--dim);padding:12px 3px 10px;font-size:11px}
.nav button.active{color:var(--bright);background:rgba(255,176,0,.08)}
.fab{position:fixed;right:max(18px,calc((100vw - 780px)/2 + 18px));bottom:78px;z-index:45;width:54px;height:54px;border-radius:50%;background:var(--amber);color:#120b00;border:0;font-size:30px;font-weight:bold;box-shadow:0 0 22px var(--shadow)}
.nav b{display:block;font-size:15px;margin-bottom:3px}
.search{width:100%;background:#050400;border:1px solid var(--line);color:var(--bright);padding:10px;outline:none}
.search:focus{border-color:var(--amber);box-shadow:0 0 10px var(--shadow)}
.global-search-wrap{position:relative;margin:0 0 12px;z-index:35}
.global-search-line{display:flex;align-items:center;border:1px solid var(--line);background:#050400}
.global-search-prompt{padding:0 0 0 10px;color:var(--bright);white-space:nowrap;font-weight:bold}
.global-search-input{border:0!important;box-shadow:none!important}
.global-search-results{position:absolute;left:0;right:0;top:calc(100% + 3px);max-height:62vh;overflow:auto;background:#090600;border:1px solid var(--amber);box-shadow:0 8px 30px rgba(0,0,0,.8);padding:8px}
.search-group-title{font-size:11px;color:var(--bright);padding:7px 5px 4px;border-bottom:1px solid var(--line)}
.search-hit{width:100%;text-align:left;background:transparent;color:var(--amber);border:0;border-bottom:1px solid rgba(111,75,0,.45);padding:9px 6px;display:block}
.search-hit:hover{background:rgba(255,176,0,.08)}
.search-hit b{display:block;color:var(--bright);font-size:13px}
.search-hit span{display:block;color:var(--dim);font-size:11px;margin-top:3px}
.search-hint{font-size:10px;color:var(--dim);padding:5px 8px 0}
.contact-links{margin-top:10px;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.contact-link-row{display:grid;grid-template-columns:82px minmax(0,1fr) auto;gap:8px;align-items:center;padding:8px 2px;border-bottom:1px solid rgba(111,75,0,.4)}
.contact-link-row:last-child{border-bottom:0}
.contact-link-label{font-size:11px;color:var(--dim)}
.contact-link-value{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--amber);font-size:12px;font-weight:400}
.contact-link-action{background:transparent;border:0;color:var(--amber);padding:4px 2px;font-size:11px;white-space:nowrap}
.contact-link-action:hover{text-decoration:underline;color:var(--bright)}
.contact-link-action:disabled{color:var(--dim);cursor:default;text-decoration:none}
@media(max-width:520px){.contact-link-row{grid-template-columns:68px minmax(0,1fr) auto}.contact-link-value{font-size:12px}.contact-link-action{font-size:10px}}
@media(max-width:700px){.global-search-prompt{font-size:11px}.global-search-results{max-height:55vh}}
.pipeline{display:grid;gap:10px}
.stage{border-left:3px solid var(--line);padding-left:9px}
.stage-head{color:var(--bright);margin:5px 0}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:80;display:flex;align-items:flex-end;justify-content:center}
.modal{width:min(780px,100%);max-height:92vh;overflow:auto;background:#090600;border:1px solid var(--amber);padding:16px;box-shadow:0 0 30px var(--shadow)}
label{display:block;color:var(--dim);font-size:12px;margin:11px 0 4px}
input,select,textarea{width:100%;background:#050400;border:1px solid var(--line);color:var(--bright);padding:10px;outline:none}
textarea{min-height:88px;resize:vertical}
.empty{color:var(--dim);padding:14px 0}
hr{border:0;border-top:1px dashed var(--line);margin:12px 0}
kbd{border:1px solid var(--line);padding:1px 4px;color:var(--dim)}
.filepick{display:block;border:1px dashed var(--amber);padding:14px;text-align:center;margin:10px 0;color:var(--bright);cursor:pointer}
.filepick input{display:none}
.ok{color:var(--bright)}
.warn{color:var(--danger)}
@media(min-width:650px){.pipeline{grid-template-columns:repeat(2,1fr)}}
.login-shell{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:18px}
.login-box{width:min(440px,100%);border:1px solid var(--amber);background:#090600;padding:20px;box-shadow:0 0 30px var(--shadow)}
.statusline{border:1px solid var(--line);padding:8px 10px;margin:10px 0;font-size:12px}
.userline{margin-top:7px;display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}
.nav{padding-bottom:env(safe-area-inset-bottom)}
.fab{margin-bottom:env(safe-area-inset-bottom)}

/* TERMINAL ORG CHART */
.org-scroll{overflow-x:auto;overflow-y:hidden;padding:18px 8px 26px;-webkit-overflow-scrolling:touch}
.org-tree{display:flex;justify-content:center;min-width:max-content}
.org-tree ul{padding-top:28px;position:relative;display:flex;justify-content:center;margin:0;padding-left:0}
.org-tree li{list-style:none;text-align:center;position:relative;padding:28px 8px 0;margin:0}
.org-tree li::before,.org-tree li::after{content:"";position:absolute;top:0;right:50%;border-top:1px solid var(--line);width:50%;height:28px}
.org-tree li::after{right:auto;left:50%;border-left:1px solid var(--line)}
.org-tree li:only-child::before,.org-tree li:only-child::after{display:none}
.org-tree li:only-child{padding-top:0}
.org-tree li:first-child::before,.org-tree li:last-child::after{border:0}
.org-tree li:last-child::before{border-right:1px solid var(--line)}
.org-tree ul ul::before{content:"";position:absolute;top:0;left:50%;border-left:1px solid var(--line);width:0;height:28px}
.org-node{min-width:180px;max-width:230px;border:1px solid var(--amber);background:var(--bg);padding:10px 12px;display:inline-block;cursor:pointer;box-shadow:0 0 8px rgba(255,176,0,.12)}
.org-node:hover{background:rgba(255,176,0,.08)}
.org-node .org-name{font-weight:700;color:var(--bright);font-size:13px}
.org-node .org-role{font-size:11px;margin-top:4px;color:var(--amber)}
.org-node .org-meta{font-size:10px;margin-top:6px;color:var(--dim)}
.org-legend{font-size:10px;color:var(--dim);margin:0 0 8px}


/* SCROLL SIN BARRA VISIBLE */
html,body,.modal,.modalbox,.org-scroll{scrollbar-width:none;-ms-overflow-style:none}
html::-webkit-scrollbar,body::-webkit-scrollbar,.modal::-webkit-scrollbar,.modalbox::-webkit-scrollbar,.org-scroll::-webkit-scrollbar{display:none;width:0;height:0}

.org-viewport{position:relative;width:100%;overflow:hidden}.org-scroll{overflow-x:auto;overflow-y:hidden;scroll-behavior:smooth;overscroll-behavior-x:contain}.org-nav{display:flex;justify-content:space-between;align-items:center;margin:6px 0}.org-nav .org-hint{font-size:10px;color:var(--dim);text-align:center;flex:1}.org-nav button{min-width:46px}
.header-main{display:flex;align-items:center;min-width:0}
.header-title{font-size:19px;letter-spacing:.5px;color:var(--bright)}
.header-sub{margin-top:3px}
.header-brandline{display:grid;grid-template-columns:auto minmax(180px,1fr) auto;align-items:center;gap:18px;width:100%}
.header-hero{display:flex;justify-content:center;align-items:center;min-width:0;height:154px;overflow:hidden}
.header-hero img{height:148px;width:auto;max-width:100%;object-fit:contain;image-rendering:pixelated;filter:drop-shadow(0 0 7px rgba(255,176,0,.22))}
.header-status{white-space:nowrap;align-self:start;padding-top:5px}
@media(max-width:700px){
 .header-brandline{grid-template-columns:1fr auto;gap:8px}
 .header-hero{grid-column:1 / -1;grid-row:2;height:122px}
 .header-hero img{height:116px}
 .header-title{font-size:15px}
 .header-status{grid-column:2;grid-row:1}
}

.pulse-stat{font:inherit;color:inherit;text-align:center;cursor:pointer;background:transparent}
.pulse-stat:hover{border-color:var(--bright)}
.pulse-week{width:100%;display:grid;grid-template-columns:72px 1fr 32px;gap:10px;align-items:center;border:0;border-bottom:1px solid var(--line);background:transparent;color:var(--amber);font:inherit;padding:10px 2px;text-align:left;cursor:pointer}
.pulse-week:last-child{border-bottom:0}.pulse-bar{height:8px;border:1px solid var(--line);display:block}.pulse-bar i{display:block;height:100%;background:var(--amber)}
.pulse-insight{display:block;width:100%;border:0;border-bottom:1px solid var(--line);background:transparent;color:var(--amber);font:inherit;text-align:left;padding:10px 2px;cursor:pointer;line-height:1.45}.pulse-insight:last-child{border-bottom:0}
.pulse-detail{margin-top:18px;border-top:1px solid var(--line);padding-top:12px}
 .pulse-type-summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:8px;margin:8px 0 14px}
.pulse-type-chip{display:flex;align-items:center;gap:9px;min-height:54px;padding:9px 10px;border:1px solid var(--line-soft);border-radius:9px;background:rgba(255,190,55,.025);color:var(--text);cursor:pointer;text-align:left;font:inherit}
.pulse-type-chip:hover,.pulse-type-chip.active{border-color:var(--bright);background:rgba(255,190,55,.09)}
.pulse-type-chip .pulse-type-icon{font-size:20px;line-height:1}
.pulse-type-chip b{display:block;color:var(--bright);font-size:17px}.pulse-type-chip .small{display:block;margin-top:1px}
@media(max-width:520px){.pulse-type-summary{grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}.pulse-type-chip{min-height:48px;padding:7px 8px}.pulse-type-chip .pulse-type-icon{font-size:18px}}
@media(max-width:520px){.pulse-week{grid-template-columns:64px 1fr 26px;gap:7px}.pulse-stat{min-width:0}}

/* V0.71 — Contact horizontal touch timeline + V0.70 refinements.
   .app>* sets position:relative with higher specificity than .nav/.fab,
   so re-assert fixed positioning on these direct children. */
.app>.nav{
  position:fixed !important;
  left:50% !important;
  right:auto !important;
  bottom:0 !important;
  transform:translateX(-50%) !important;
  width:min(860px,100%) !important;
  display:grid !important;
  grid-template-columns:repeat(8,minmax(0,1fr)) !important;
  z-index:60 !important;
  margin:0 !important;
  padding-bottom:env(safe-area-inset-bottom) !important;
}
.app>.fab{
  position:fixed !important;
  left:auto !important;
  right:max(18px,calc((100vw - min(860px,100vw))/2 + 18px)) !important;
  bottom:calc(72px + env(safe-area-inset-bottom)) !important;
  z-index:65 !important;
  margin:0 !important;
}
/* Reserve space so the fixed nav never covers the final record. */
.app{padding-bottom:calc(94px + env(safe-area-inset-bottom)) !important}
@media(max-width:700px){
  .app>.nav{width:100% !important;grid-template-columns:repeat(8,minmax(0,1fr)) !important}
  .app>.nav button{min-width:0;padding:8px 1px 7px;font-size:9px}
  .app>.nav b{font-size:12px}
  .app>.fab{right:14px !important;bottom:calc(68px + env(safe-area-inset-bottom)) !important;width:48px;height:48px;font-size:27px}
  .app{padding-bottom:calc(88px + env(safe-area-inset-bottom)) !important}
}
@media(max-width:430px){
  .app>.nav button{font-size:8px;letter-spacing:-.02em}
  .app>.nav b{font-size:11px}
}


/* V0.75 — Weekly PULSO detail includes distinct accounts touched.
   V0.74 — Universal search includes tasks.
   V0.72 — Fluid portrait / narrow-desktop layout.
   On tall windows and tablets, use the available width instead of locking
   the CRM to the desktop max-width. Wide landscape desktop keeps the
   established centered 860px workspace. */
@media (min-width:701px) and (max-aspect-ratio:4/3){
  .app{
    width:calc(100% - 40px) !important;
    max-width:none !important;
    margin-left:20px !important;
    margin-right:20px !important;
    padding-left:16px !important;
    padding-right:16px !important;
  }
  .app>.nav{
    width:calc(100% - 40px) !important;
    max-width:none !important;
  }
  .app>.fab{
    right:38px !important;
  }
}
@media (min-width:701px) and (max-width:900px){
  .app{
    width:calc(100% - 32px) !important;
    max-width:none !important;
    margin-left:16px !important;
    margin-right:16px !important;
  }
  .app>.nav{width:calc(100% - 32px) !important}
  .app>.fab{right:32px !important}
}

</style>

<style id="terminal-refined-v065">
/* V0.65 — Terminal Ámbar Refinada. Visual-only evolution of V0.62. */
:root{
  --bg:#090806;
  --panel:#0f0d09;
  --panel-2:#14110b;
  --amber:#e8a31a;
  --bright:#f3c76a;
  --text:#e7d7b6;
  --dim:#9f8552;
  --line:#4f3b18;
  --line-soft:rgba(232,163,26,.18);
  --danger:#d97935;
  --success:#9dbb72;
  --shadow:rgba(232,163,26,.10);
}
html,body,#root{background:var(--bg);color:var(--text)}
body{
  font-family:Inter,-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Arial,sans-serif;
  letter-spacing:0;
  -webkit-font-smoothing:antialiased;
}
.app{max-width:860px;padding:14px 16px 92px}
/* Keep the terminal identity, but remove visible CRT scanlines/glow noise. */
.crt:before{display:none}
.crt:after{box-shadow:inset 0 0 54px rgba(0,0,0,.34);z-index:0}
.app>*{position:relative;z-index:1}
header{
  border:1px solid var(--line-soft);

  margin-bottom:12px;
  box-shadow:0 10px 28px rgba(0,0,0,.18);
  border-radius:10px;
}
.brand strong,.header-title,.title,.section-title,.stage-head{color:var(--bright);text-shadow:none}
.header-title{font-size:18px;letter-spacing:.04em;font-family:"SFMono-Regular",Consolas,"Liberation Mono",monospace}
.header-sub,.small,.meta,label,.contact-link-label,.search-hint,.org-legend{color:var(--dim)}
.header-hero img{filter:drop-shadow(0 8px 16px rgba(0,0,0,.25));opacity:.94}
.stats{gap:8px;margin:10px 0 12px}
.stat,.card,.section{
  border:1px solid var(--line-soft);
  background:linear-gradient(180deg,rgba(255,255,255,.018),rgba(232,163,26,.014));
  border-radius:9px;
}
.stat{padding:8px 9px}
.stat b{color:var(--bright);font-size:17px}
.section{padding:11px 12px;margin:9px 0}
.card{padding:10px 11px;margin:7px 0}
.section-title{margin-bottom:9px;font-weight:700;letter-spacing:.02em}
.hoy-section>.section-title{padding:4px 1px}
.hoy-section.open>.section-title{margin-bottom:8px}
.row{gap:9px}
.title{font-weight:700}
.meta{line-height:1.38}
.tag{
  border:1px solid var(--line-soft);
  color:var(--text);
  background:rgba(232,163,26,.035);
  border-radius:999px;
  padding:2px 7px;
}
.actions{gap:6px;margin-top:8px}
.btn{
  background:rgba(255,255,255,.012);
  color:var(--text);
  border:1px solid rgba(232,163,26,.44);
  padding:7px 10px;
  border-radius:7px;
  text-transform:uppercase;
  font-size:11px;
  font-weight:650;
  letter-spacing:.035em;
  transition:background .15s ease,border-color .15s ease,color .15s ease,transform .1s ease;
}
.btn:hover{background:rgba(232,163,26,.09);border-color:var(--amber);color:var(--bright)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--amber);color:#171006;border-color:var(--amber);font-weight:800}
.btn.dim{border-color:rgba(159,133,82,.35);color:var(--dim)}
.btn.danger{border-color:rgba(217,121,53,.55);color:#e69a62;background:rgba(217,121,53,.03)}
.search,input,select,textarea,.global-search-line{
  background:#0a0907;
  border-color:var(--line-soft);
  color:var(--text);
  border-radius:7px;
}
input,select,textarea{padding:9px 10px}
.search{padding:9px 10px}
.search:focus,input:focus,select:focus,textarea:focus{border-color:rgba(232,163,26,.62);box-shadow:0 0 0 2px rgba(232,163,26,.07)}
.global-search-line{overflow:hidden}
.global-search-results{
  background:#0c0a07;
  border-color:rgba(232,163,26,.35);
  border-radius:8px;
  box-shadow:0 18px 48px rgba(0,0,0,.48);
}
.search-hit{color:var(--text);border-bottom-color:var(--line-soft);border-radius:5px}
.search-hit:hover{background:rgba(232,163,26,.055)}
.search-hit b{color:var(--bright)}
.nav{
  width:min(860px,100%);
  background:rgba(9,8,6,.96);
  border-top:1px solid var(--line-soft);
  box-shadow:0 -10px 30px rgba(0,0,0,.28);
  backdrop-filter:blur(10px);
  -webkit-backdrop-filter:blur(10px);
}
.nav button{color:var(--dim);border-right:1px solid rgba(232,163,26,.09);padding:10px 3px 9px}
.nav button.active{color:var(--bright);background:rgba(232,163,26,.055)}
.fab{
  right:max(18px,calc((100vw - 860px)/2 + 18px));
  width:52px;height:52px;bottom:78px;
  background:var(--amber);color:#171006;
  box-shadow:0 10px 30px rgba(0,0,0,.32),0 0 0 1px rgba(243,199,106,.18);
}
.overlay{background:rgba(0,0,0,.76);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
.modal,.login-box{
  background:#0d0b08;
  border:1px solid rgba(232,163,26,.34);
  box-shadow:0 28px 80px rgba(0,0,0,.55);

 const guard=fn=>async ev=>{
  ev.preventDefault();

 async function saveActivity(ev){
  ev.preventDefault(); const f=new FormData(ev.currentTarget);
  const contactoId=f.get("contactoId")||null,oportunidadId=f.get("oportunidadId")||null;
  const empresaId=f.get("activityEmpresaId")||null;
  const editing=modal.editActivity?db.actividades.find(a=>a.id===modal.editActivity):null;
  const row={empresa_id:empresaId||null,contacto_id:contactoId,oportunidad_id:oportunidadId,iniciativa_id:f.get("iniciativaId")||null,tipo:f.get("tipo"),fecha:f.get("fecha"),nota:f.get("nota")||null};
  const changes=[]; let data,error;
  if(editing)({data,error}=await sb.from("actividades").update(row).eq("id",editing.id).select().single());
  else ({data,error}=await sb.from("actividades").insert({...row,user_id:session.user.id}).select().single());
  if(await cloudError(error))return;changes.push(["actividades",data]);
  if(contactoId){
    // Último contacto is the newest touch, so a back-dated or edited old activity never moves it backwards.
    // A manual date on the contact is kept unless it came from the activity being edited.
    const contact=db.contactos.find(c=>c.id===contactoId);
    const otherDates=db.actividades.filter(a=>a.contactoId===contactoId&&a.id!==editing?.id).map(a=>a.fecha);
    const manual=editing&&editing.contactoId===contactoId&&contact?.ultimo===editing.fecha?"":contact?.ultimo;
    const upd={ultimo_contacto:[f.get("fecha"),...otherDates,manual].filter(Boolean).sort().pop()};if(!editing&&f.get("proximo"))upd.proximo_contacto=f.get("proximo");
    ({data,error}=await sb.from("contactos").update(upd).eq("id",contactoId).select().single());if(await cloudError(error))return;changes.push(["contactos",data]);
  }
  const shouldUpdate=!editing||f.get("updateNext")==="yes";
  const nextTitle=(f.get("accion")||"").trim(), nextDate=f.get("proximo")||null;
  const oppBefore=oportunidadId?db.oportunidades.find(o=>o.id===oportunidadId):null;
  if(shouldUpdate&&oportunidadId&&nextTitle){
    ({data,error}=await sb.from("oportunidades").update({proxima_accion:nextTitle,fecha_proxima_accion:nextDate}).eq("id",oportunidadId).select().single());
    if(await cloudError(error))return;changes.push(["oportunidades",data]);
  }
  if(shouldUpdate&&nextTitle&&nextDate){
    let followTask=null;
    if(oportunidadId){
      const previousTitle=(oppBefore?.proxima||"").trim();
      const candidates=(db.tareas||[]).filter(t=>!t.completada&&t.oportunidadId===oportunidadId);
      followTask=candidates.find(t=>previousTitle&&t.texto===previousTitle)||candidates.find(t=>t.texto===nextTitle);
    }else if(contactoId){followTask=(db.tareas||[]).find(t=>!t.completada&&!t.oportunidadId&&t.contactoId===contactoId&&t.texto===nextTitle);}
    const taskRow={titulo:nextTitle,fecha:nextDate,prioridad:"Normal",empresa_id:empresaId||oppBefore?.empresaId||null,contacto_id:contactoId||null,oportunidad_id:oportunidadId||null,completada:false};
    if(followTask)({data,error}=await sb.from("tareas").update(taskRow).eq("id",followTask.id).select().single());
    else ({data,error}=await sb.from("tareas").insert({...taskRow,user_id:session.user.id}).select().single());
    if(await cloudError(error))return;changes.push(["tareas",data]);
  }
  applyCloudRows(changes);setModal(false);
 }

       <hr/><div className="section-title"><span>EVIDENCIAS</span><span>{(r.evidencias||[]).length}</span></div>
       {(r.evidencias||[]).length?(r.evidencias||[]).map(ev=><div className="card" key={ev.id}><div className="row"><div><div className="title">{ev.titulo||"Evidencia"}</div><div className="meta">{ev.fecha||"—"} · {ev.fuente||"Mercado Público"}</div></div></div><div className="actions">{ev.link&&<button className="btn dim" onClick={()=>window.open(ev.link,"_blank","noopener,noreferrer")}>ABRIR FUENTE ↗</button>}<button className="btn dim" onClick={()=>setModal({editEvidence:ev.id,editEvidenceRadar:r.id})}>EDITAR</button><button className="btn danger" onClick={()=>removeRadarEvidence(r.id,ev.id)}>BORRAR</button></div></div>):<div className="empty">SIN EVIDENCIAS.</div>}
      </>
    })():(modal.editEvidence&&modal.editEvidenceRadar)?(()=>{
      const r=(db.radar||[]).find(x=>x.id===modal.editEvidenceRadar)||{};
      const ev=(r.evidencias||[]).find(x=>x.id===modal.editEvidence)||{};
      return <><div className="section-title"><span>EDITAR EVIDENCIA</span><button className="btn dim" onClick={()=>setModal({viewRadar:r.id})}>ESC</button></div>
       <div className="small" style={{marginBottom:"10px"}}>RADAR · {r.nombre||"—"}</div>
       <form onSubmit={guard(saveRadarEvidence)}>
        <label>FECHA</label><input type="date" name="fecha" defaultValue={ev.fecha||today}/>
        <label>TÍTULO / HALLAZGO *</label><input name="titulo" required defaultValue={ev.titulo||""} placeholder="Ej: Licitación soporte SAP"/>
        <label>FUENTE</label><input name="fuente" defaultValue={ev.fuente||"Mercado Público"}/>
        <label>LINK</label><input type="url" name="link" defaultValue={ev.link||""} placeholder="https://..."/>
        <div className="actions"><button className="btn primary">GUARDAR CAMBIOS</button><button className="btn dim" type="button" onClick={()=>setModal({viewRadar:r.id})}>CANCELAR</button></div>
       </form>
      </>
    })():(modal.newRadar||modal.editRadar)?(()=>{
      const r=modal.editRadar?(db.radar||[]).find(x=>x.id===modal.editRadar):{};
      return <><div className="section-title"><span>{modal.editRadar?"EDITAR RADAR":"NUEVO RADAR"}</span><button className="btn dim" onClick={()=>setModal(false)}>ESC</button></div>
       <form onSubmit={guard(saveRadar)}><label>ORGANIZACIÓN *</label><input name="nombre" required defaultValue={r.nombre||""} placeholder="Ej: Municipalidad de ..."/><label>SECTOR</label><input name="sector" defaultValue={r.sector||"Público"}/><label>SISTEMA INFERIDO</label><input name="sistema" defaultValue={r.sistema||""} placeholder="Ej: SAP, Oracle EBS, PeopleSoft..."/><label>CONFIANZA</label><select name="confianza" defaultValue={r.confianza||"Media"}><option>Alta</option><option>Media</option><option>Baja</option></select><label>ESTADO</label><select name="estado" defaultValue={r.estado||"Observando"}><option>Observando</option><option>Activado</option><option>Descartado</option></select><label>NOTAS / HIPÓTESIS</label><textarea name="notas" defaultValue={r.notas||""} placeholder="Qué inferimos y por qué puede ser relevante..."></textarea>
       <div className="card"><div className="title">+ AGREGAR EVIDENCIA (OPCIONAL)</div><label>FECHA</label><input type="date" name="evidenciaFecha" defaultValue={today}/><label>TÍTULO / HALLAZGO</label><input name="evidenciaTitulo" placeholder="Ej: Licitación soporte SAP"/><label>FUENTE</label><input name="evidenciaFuente" defaultValue="Mercado Público"/><label>LINK</label><input type="url" name="evidenciaLink" placeholder="https://..."/></div>
       <div className="actions"><button className="btn primary">GUARDAR</button>{modal.editRadar&&<button className="btn danger" type="button" onClick={()=>deleteRadar(r.id)}>ELIMINAR</button>}<button className="btn dim" type="button" onClick={()=>setModal(false)}>CANCELAR</button></div></form>
      </>
    })():(modal.newCompany||modal.editCompany)?(()=>{
      const e=modal.editCompany?db.empresas.find(x=>x.id===modal.editCompany):{};
      return <><div className="section-title"><span>{modal.editCompany?"EDITAR EMPRESA":"NUEVA EMPRESA"}</span><button className="btn dim" onClick={()=>setModal(false)}>ESC</button></div>
       <form onSubmit={guard(saveCompany)}><label>NOMBRE *</label><input name="nombre" required defaultValue={e.nombre||""}/><label>INDUSTRIA</label><input name="industria" defaultValue={e.industria||""}/><label>ESTADO</label><select name="estado" defaultValue={e.estado||"Prospecto"}><option>Prospecto</option><option>Cliente</option><option>Partner</option><option>Inactivo</option></select><label>POTENCIAL</label><select name="potencial" defaultValue={e.potencial||"Medio"}><option>Alto</option><option>Medio</option><option>Bajo</option></select><div className="actions"><button className="btn primary">GUARDAR</button>{modal.editCompany&&<button className="btn danger" type="button" onClick={()=>deleteCompany(e.id)}>ELIMINAR</button>}<button className="btn dim" type="button" onClick={()=>setModal(false)}>CANCELAR</button></div></form>
      </>
    })():<>
    {(()=>{
      const a=modal.editActivity?db.actividades.find(x=>x.id===modal.editActivity):null;
      const contextContactId=a?.contactoId||modal.contact||"";
      const contextContact=contextContactId?db.contactos.find(c=>c.id===contextContactId):null;
      const contextOpp=modal.opp?db.oportunidades.find(o=>o.id===modal.opp):null;
      const contactOpps=contextContactId?db.oportunidades.filter(o=>(o.contactos||[]).includes(contextContactId)):[];
      const activeContactOpps=contactOpps.filter(o=>!["Ganada","Perdida","Nurturing"].includes(o.etapa));
      const autoOppId=a?.oportunidadId||modal.opp||(activeContactOpps.length===1?activeContactOpps[0].id:"");
      const autoOpp=autoOppId?db.oportunidades.find(o=>o.id===autoOppId):null;
      const autoCompanyId=a?.empresaId||modal.company||contextContact?.empresaId||contextOpp?.empresaId||autoOpp?.empresaId||"";
      const linkedOpp=a?.oportunidadId?db.oportunidades.find(o=>o.id===a.oportunidadId):null;
      const orderedOpps=contextContactId?[...contactOpps,...db.oportunidades.filter(o=>!(o.contactos||[]).includes(contextContactId))]:db.oportunidades;
      // When the activity is opened from an opportunity (or editing one already linked),
      // only participants explicitly associated with that opportunity are valid choices.
      const activityOppContext=a?.oportunidadId?db.oportunidades.find(o=>o.id===a.oportunidadId):contextOpp;
      const activityContacts=activityOppContext
       ?(activityOppContext.contactos||[]).map(id=>db.contactos.find(c=>c.id===id)).filter(Boolean)
       :modal.company
        ?db.contactos.filter(c=>c.empresaId===modal.company)
        :db.contactos;
      return <><div className="section-title"><span>{a?"EDITAR ACTIVIDAD":"REGISTRAR ACTIVIDAD"}</span><button className="btn dim" onClick={()=>setModal(false)}>ESC</button></div>
      <form onSubmit={guard(saveActivity)}>
       <label>TIPO</label><select name="tipo" defaultValue={a?.tipo||"Llamada"}><option>Llamada</option><option>Reunión</option><option>WhatsApp</option><option>Email</option><option>Nota</option></select>
       <label>EMPRESA</label><select name="activityEmpresaId" defaultValue={autoCompanyId}><option value="">-- SIN EMPRESA --</option>{db.empresas.map(e=><option key={e.id} value={e.id}>{e.nombre}</option>)}</select>
       <label>CONTACTO</label><select name="contactoId" defaultValue={contextContactId}><option value="">-- SIN CONTACTO --</option>{activityContacts.map(c=><option key={c.id} value={c.id}>{c.nombre} · {emp(c.empresaId)?.nombre}</option>)}</select>
       {activityOppContext&&<div className="small" style={{marginTop:"-6px",marginBottom:"8px"}}>{activityContacts.length?`${activityContacts.length} CONTACTO${activityContacts.length===1?"":"S"} ASOCIADO${activityContacts.length===1?"":"S"} A ESTA OPORTUNIDAD`:"ESTA OPORTUNIDAD NO TIENE CONTACTOS ASOCIADOS"}</div>}
       <label>OPORTUNIDAD</label><select name="oportunidadId" defaultValue={autoOppId}><option value="">-- SIN OPORTUNIDAD --</option>{orderedOpps.map(o=><option key={o.id} value={o.id}>{emp(o.empresaId)?.nombre} · {o.nombre}</option>)}</select>
       <label>INICIATIVA COMERCIAL</label><select name="iniciativaId" defaultValue={a?.iniciativaId||modal.initiative||autoOpp?.iniciativaId||""}><option value="">-- SIN INICIATIVA --</option>{(db.iniciativas||[]).filter(i=>i.estado==="Activa"&&(!autoCompanyId||i.empresaId===autoCompanyId||i.cuentas.some(c=>c.empresaId===autoCompanyId))).map(i=><option key={i.id} value={i.id}>{i.tipo} · {i.nombre}</option>)}</select><div className="small" style={{marginTop:"-6px",marginBottom:"8px"}}>OPCIONAL · IDENTIFICA QUÉ ESTRATEGIA COMERCIAL ORIGINÓ ESTA ACTIVIDAD.</div>
       <label>FECHA</label><input name="fecha" type="date" defaultValue={a?.fecha||today} required/>
       <label>RESULTADO / NOTA</label><textarea name="nota" defaultValue={a?.nota||""} placeholder="> ¿Qué pasó?"></textarea>
       <label>PRÓXIMA ACCIÓN</label><input name="accion" defaultValue={a?linkedOpp?.proxima||"":""} placeholder="Ej: Seguimiento propuesta"/>
       <label>FECHA PRÓXIMA ACCIÓN</label><input name="proximo" type="date" defaultValue={a?linkedOpp?.fecha||"":""}/>
       {a&&<div className="card"><label style={{margin:"0",color:"var(--text)"}}><input style={{width:"auto",marginRight:"8px"}} type="checkbox" name="updateNext" value="yes"/>ACTUALIZAR TAMBIÉN LA PRÓXIMA ACCIÓN DE LA OPORTUNIDAD</label><div className="meta">DESMARCADO = SOLO CORRIGE EL REGISTRO HISTÓRICO.</div></div>}
       <div className="actions"><button className="btn primary" type="submit">{a?"GUARDAR CAMBIOS":"GUARDAR"}</button>{a&&<button className="btn danger" type="button" onClick={()=>deleteActivity(a.id)}>ELIMINAR</button>}<button className="btn dim" type="button" onClick={()=>setModal(false)}>CANCELAR</button></div>
      </form></>
    })()}</>}
   </div></div>}
  {dialog&&<div className="overlay" style={{zIndex:120}} onClick={()=>setDialog(null)}>
    <div className="modal" style={{maxWidth:"520px",alignSelf:"center"}} onClick={e=>e.stopPropagation()}>
      <div className="section-title"><span>{dialog.title}</span><button className="btn dim" onClick={()=>setDialog(null)}>ESC</button></div>
      {dialog.custom ? dialog.body : <>
       <div className="card"><div style={{lineHeight:"1.55"}}>{dialog.message}</div></div>
       <div className="actions">
        {dialog.type==="confirm"&&<button className="btn danger" onClick={dialog.onConfirm}>CONFIRMAR</button>}
        <button className="btn primary" onClick={()=>setDialog(null)}>{dialog.type==="confirm"?"CANCELAR":"ACEPTAR"}</button>
       </div>
      </>}
    </div>
  </div>}
  {toast&&<div className="toast" key={toast.id} role="status">✓ {toast.msg}</div>}
 </div></Ctx.Provider>
}
// V0.84 — Any render error shows a recoverable screen instead of a blank page.
class ErrorBoundary extends React.Component{
 constructor(p){super(p);this.state={error:null}}
 static getDerivedStateFromError(error){return {error}}
 componentDidCatch(error,info){console.error("Ninja Sales Terminal:",error,info)}
 render(){
  if(!this.state.error)return this.props.children;
  return <div className="login-shell crt"><div className="login-box">
   <div className="section-title"><span>ERROR DE PANTALLA</span></div>
   <div className="meta">ALGO FALLÓ AL MOSTRAR ESTA VISTA. TUS DATOS EN SUPABASE NO SE MODIFICARON.</div>
   <div className="statusline warn">{String(this.state.error?.message||this.state.error)}</div>
   <div className="actions"><button className="btn primary" onClick={()=>this.setState({error:null})}>VOLVER AL INICIO</button><button className="btn dim" onClick={()=>location.reload()}>RECARGAR</button></div>
  </div></div>;
 }
}
ReactDOM.createRoot(document.getElementById("root")).render(<ErrorBoundary><App/></ErrorBoundary>);
</script>
