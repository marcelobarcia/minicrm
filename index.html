textarea{min-height:88px;resize:vertical}

hr{border:0;border-top:1px dashed var(--line);margin:12px 0}

.nav{padding-bottom:env(safe-area-inset-bottom)}

  const row={empresa_id:empresaId||null,contacto_id:contactoId,oportunidad_id:oportunidadId,tipo:f.get("tipo"),fecha:f.get("fecha"),nota:f.get("nota")||null};
  let q=editing?sb.from("actividades").update(row).eq("id",editing.id):sb.from("actividades").insert({...row,user_id:session.user.id});
  let {error}=await q;if(await cloudError(error))return;
  if(contactoId){
    const upd={ultimo_contacto:f.get("fecha")};if(!editing&&f.get("proximo"))upd.proximo_contacto=f.get("proximo");
    ({error}=await sb.from("contactos").update(upd).eq("id",contactoId));if(await cloudError(error))return;
  }
  const shouldUpdate=!editing||f.get("updateNext")==="yes";
  if(shouldUpdate&&oportunidadId&&f.get("accion")){
    ({error}=await sb.from("oportunidades").update({proxima_accion:f.get("accion"),fecha_proxima_accion:f.get("proximo")||null}).eq("id",oportunidadId));if(await cloudError(error))return;
  }
  setModal(false);await loadCloud();
 }

   </div></div>}
  {dialog&&<div className="overlay" style={{zIndex:120}} onClick={()=>setDialog(null)}>

      <div className="card"><div style={{lineHeight:"1.55"}}>{dialog.message}</div></div>
      <div className="actions">
       {dialog.type==="confirm"&&<button className="btn danger" onClick={dialog.onConfirm}>CONFIRMAR</button>}
       <button className="btn primary" onClick={()=>setDialog(null)}>{dialog.type==="confirm"?"CANCELAR":"ACEPTAR"}</button>
      </div>
    </div>
  </div>}
 </div>
}
