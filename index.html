 function activateRadar(id){
  const r=(db.radar||[]).find(x=>x.id===id);if(!r)return;if(r.empresaId){setModal({viewCompany:r.empresaId});return}
  const existing=db.empresas.find(e=>norm(e.nombre)===norm(r.nombre));
  if(existing){askConfirm("EMPRESA YA EXISTE",`${existing.nombre} ya existe en EMPRESAS. ¿Quieres vincular este RADAR con esa empresa?`,()=>doActivateRadar(r,existing));return}
  askConfirm("ACTIVAR COMO EMPRESA",`Se creará ${r.nombre} en EMPRESAS y este registro RADAR quedará vinculado como ACTIVADO.`,()=>doActivateRadar(r,null));
 }

       {(db.licitaciones||[]).filter(t=>t.empresaId===e.id).sort((a,b)=>(b.fechaPublicacion||"").localeCompare(a.fechaPublicacion||"")).map(t=><div className="card" key={t.id}><div className="row"><div><div className="title">{t.nombre}</div><div className="meta">{t.estado} // PARTICIPAMOS: {t.participacion}</div></div>{t.presupuesto>0&&<span className="tag">{t.moneda} {Number(t.presupuesto).toLocaleString("es-CL")}</span>}</div><div className="meta">VENCE: {t.fin||"—"} // INCUMBENTE: {t.adjudicatarios.filter(a=>!a.nosotros).map(a=>a.empresa).join(", ")||"—"}</div><div className="actions"><button className="btn dim" onClick={()=>setModal({viewTender:t.id})}>VER →</button></div></div>)}
       {!(db.licitaciones||[]).some(t=>t.empresaId===e.id)&&<div className="empty">SIN LICITACIONES REGISTRADAS.</div>}
       <hr/><div className="section-title"><span>&gt; OPORTUNIDADES</span><span>{os.length}</span></div>
       {os.length?os.map(o=><Opportunity key={o.id} o={o}/>):<div className="empty">SIN OPORTUNIDADES.</div>}
       <hr/><div className="section-title"><span>&gt; TAREAS</span><span>{ts.filter(t=>!t.completada).length} ABIERTAS</span></div>
       {ts.length?ts.map(t=><TaskCard key={t.id} t={t}/>):<div className="empty">SIN TAREAS.</div>}
       <hr/><div className="section-title"><span>&gt; NOTAS</span><span>{ns.length}</span></div>
       {ns.length?ns.map(n=><div className="card" key={n.id}><div className="row"><div className="title">NOTA</div><span className="small">{new Date(n.fecha).toLocaleString("es-CL")}</span></div><div style={{marginTop:"7px"}}>{n.texto}</div><div className="actions"><button className="btn danger" onClick={()=>deleteNote(n.id)}>BORRAR</button></div></div>):<div className="empty">SIN NOTAS.</div>}
       <hr/><div className="section-title"><span>&gt; ACTIVIDAD</span><span>{acts.length}</span></div>
       {acts.length?acts.slice(0,15).map(a=><div className="card" key={a.id}><div className="row"><div className="title">{a.tipo}</div><span className="small">{a.fecha}</span></div><div className="meta">{a.nota||"SIN NOTA"}</div><div className="actions"><button className="btn dim" onClick={()=>setModal({editActivity:a.id})}>EDITAR</button><button className="btn danger" onClick={()=>deleteActivity(a.id)}>ELIMINAR</button></div></div>):<div className="empty">SIN ACTIVIDAD.</div>}
      </>
    })():modal.viewRadar?(()=>{
      const r=(db.radar||[]).find(x=>x.id===modal.viewRadar);if(!r)return <div className="empty">RADAR NO ENCONTRADO.</div>;
      return <><div className="section-title"><span>&gt; FICHA RADAR</span><button className="btn dim" onClick={()=>setModal(false)}>ESC</button></div>
       <div className="title" style={{fontSize:"20px"}}>{r.nombre}</div><div className="meta">SECTOR: {r.sector||"—"} // ESTADO: {r.estado}<br/>SISTEMA INFERIDO: {r.sistema||"SIN INFERIR"} // CONFIANZA: {r.confianza}</div>
       <div className="actions">{r.empresaId?<button className="btn primary" onClick={()=>setModal({viewCompany:r.empresaId})}>VER EMPRESA →</button>:<button className="btn primary" onClick={()=>activateRadar(r.id)}>ACTIVAR COMO EMPRESA →</button>}<button className="btn dim" onClick={()=>setModal({editRadar:r.id})}>EDITAR</button></div>
       <hr/><div className="small">NOTAS / HIPÓTESIS</div><div>{r.notas||"—"}</div>
       <hr/><div className="section-title"><span>&gt; EVIDENCIAS</span><span>{(r.evidencias||[]).length}</span></div>
       {(r.evidencias||[]).length?(r.evidencias||[]).map(ev=><div className="card" key={ev.id}><div className="row"><div><div className="title">{ev.titulo||"Evidencia"}</div><div className="meta">{ev.fecha||"—"} // {ev.fuente||"Mercado Público"}</div></div></div><div className="actions">{ev.link&&<button className="btn dim" onClick={()=>window.open(ev.link,"_blank","noopener,noreferrer")}>ABRIR FUENTE ↗</button>}<button className="btn dim" onClick={()=>setModal({editEvidence:ev.id,editEvidenceRadar:r.id})}>EDITAR</button><button className="btn danger" onClick={()=>removeRadarEvidence(r.id,ev.id)}>BORRAR</button></div></div>):<div className="empty">SIN EVIDENCIAS.</div>}
      </>
    })():(modal.editEvidence&&modal.editEvidenceRadar)?(()=>{
      const r=(db.radar||[]).find(x=>x.id===modal.editEvidenceRadar)||{};
      const ev=(r.evidencias||[]).find(x=>x.id===modal.editEvidence)||{};
      return <><div className="section-title"><span>&gt; EDITAR EVIDENCIA</span><button className="btn dim" onClick={()=>setModal({viewRadar:r.id})}>ESC</button></div>
       <div className="small" style={{marginBottom:"10px"}}>RADAR // {r.nombre||"—"}</div>
       <form onSubmit={saveRadarEvidence}>
        <label>FECHA</label><input type="date" name="fecha" defaultValue={ev.fecha||today}/>
        <label>TÍTULO / HALLAZGO *</label><input name="titulo" required defaultValue={ev.titulo||""} placeholder="Ej: Licitación soporte SAP"/>
        <label>FUENTE</label><input name="fuente" defaultValue={ev.fuente||"Mercado Público"}/>
        <label>LINK</label><input type="url" name="link" defaultValue={ev.link||""} placeholder="https://..."/>
        <div className="actions"><button className="btn primary">GUARDAR CAMBIOS</button><button className="btn dim" type="button" onClick={()=>setModal({viewRadar:r.id})}>CANCELAR</button></div>
       </form>
      </>
    })():(modal.newRadar||modal.editRadar)?(()=>{
      const r=modal.editRadar?(db.radar||[]).find(x=>x.id===modal.editRadar):{};
      return <><div className="section-title"><span>&gt; {modal.editRadar?"EDITAR RADAR":"NUEVO RADAR"}</span><button className="btn dim" onClick={()=>setModal(false)}>ESC</button></div>
       <form onSubmit={saveRadar}><label>ORGANIZACIÓN *</label><input name="nombre" required defaultValue={r.nombre||""} placeholder="Ej: Municipalidad de ..."/><label>SECTOR</label><input name="sector" defaultValue={r.sector||"Público"}/><label>SISTEMA INFERIDO</label><input name="sistema" defaultValue={r.sistema||""} placeholder="Ej: SAP, Oracle EBS, PeopleSoft..."/><label>CONFIANZA</label><select name="confianza" defaultValue={r.confianza||"Media"}><option>Alta</option><option>Media</option><option>Baja</option></select><label>ESTADO</label><select name="estado" defaultValue={r.estado||"Observando"}><option>Observando</option><option>Activado</option><option>Descartado</option></select><label>NOTAS / HIPÓTESIS</label><textarea name="notas" defaultValue={r.notas||""} placeholder="Qué inferimos y por qué puede ser relevante..."></textarea>
       <div className="card"><div className="title">+ AGREGAR EVIDENCIA (OPCIONAL)</div><label>FECHA</label><input type="date" name="evidenciaFecha" defaultValue={today}/><label>TÍTULO / HALLAZGO</label><input name="evidenciaTitulo" placeholder="Ej: Licitación soporte SAP"/><label>FUENTE</label><input name="evidenciaFuente" defaultValue="Mercado Público"/><label>LINK</label><input type="url" name="evidenciaLink" placeholder="https://..."/></div>
       <div className="actions"><button className="btn primary">GUARDAR</button>{modal.editRadar&&<button className="btn danger" type="button" onClick={()=>deleteRadar(r.id)}>ELIMINAR</button>}<button className="btn dim" type="button" onClick={()=>setModal(false)}>CANCELAR</button></div></form>
      </>
    })():(modal.newCompany||modal.editCompany)?(()=>{
      const e=modal.editCompany?db.empresas.find(x=>x.id===modal.editCompany):{};
      return <><div className="section-title"><span>&gt; {modal.editCompany?"EDITAR EMPRESA":"NUEVA EMPRESA"}</span><button className="btn dim" onClick={()=>setModal(false)}>ESC</button></div>
       <form onSubmit={saveCompany}><label>NOMBRE *</label><input name="nombre" required defaultValue={e.nombre||""}/><label>INDUSTRIA</label><input name="industria" defaultValue={e.industria||""}/><label>ESTADO</label><select name="estado" defaultValue={e.estado||"Prospecto"}><option>Prospecto</option><option>Cliente</option><option>Partner</option><option>Inactivo</option></select><label>POTENCIAL</label><select name="potencial" defaultValue={e.potencial||"Medio"}><option>Alto</option><option>Medio</option><option>Bajo</option></select><div className="actions"><button className="btn primary">GUARDAR</button>{modal.editCompany&&<button className="btn danger" type="button" onClick={()=>deleteCompany(e.id)}>ELIMINAR</button>}<button className="btn dim" type="button" onClick={()=>setModal(false)}>CANCELAR</button></div></form>
      </>
    })():<>
    {(()=>{
      const a=modal.editActivity?db.actividades.find(x=>x.id===modal.editActivity):null;
      const contextContactId=a?.contactoId||modal.contact||"";
      const contextContact=contextContactId?db.contactos.find(c=>c.id===contextContactId):null;
      const contextOpp=modal.opp?db.oportunidades.find(o=>o.id===modal.opp):null;
      const contactOpps=contextContactId?db.oportunidades.filter(o=>(o.contactos||[]).includes(contextContactId)):[];
      const activeContactOpps=contactOpps.filter(o=>!["Ganada","Perdida"].includes(o.etapa));
      const autoOppId=a?.oportunidadId||modal.opp||(activeContactOpps.length===1?activeContactOpps[0].id:"");
      const autoOpp=autoOppId?db.oportunidades.find(o=>o.id===autoOppId):null;
      const autoCompanyId=a?.empresaId||modal.company||contextContact?.empresaId||contextOpp?.empresaId||autoOpp?.empresaId||"";
      const linkedOpp=a?.oportunidadId?db.oportunidades.find(o=>o.id===a.oportunidadId):null;
      const orderedOpps=contextContactId?[...contactOpps,...db.oportunidades.filter(o=>!(o.contactos||[]).includes(contextContactId))]:db.oportunidades;
      // When the activity is opened from an opportunity (or editing one already linked),
      // only participants explicitly associated with that opportunity are valid choices.
      const activityOppContext=a?.oportunidadId?db.oportunidades.find(o=>o.id===a.oportunidadId):contextOpp;
      const activityContacts=activityOppContext
       ?(activityOppContext.contactos||[]).map(id=>db.contactos.find(c=>c.id===id)).filter(Boolean)
       :modal.company
        ?db.contactos.filter(c=>c.empresaId===modal.company)
        :db.contactos;
      return <><div className="section-title"><span>&gt; {a?"EDITAR ACTIVIDAD":"REGISTRAR ACTIVIDAD"}</span><button className="btn dim" onClick={()=>setModal(false)}>ESC</button></div>
      <form onSubmit={saveActivity}>
       <label>TIPO</label><select name="tipo" defaultValue={a?.tipo||"Llamada"}><option>Llamada</option><option>Reunión</option><option>WhatsApp</option><option>Email</option><option>Nota</option></select>
       <label>EMPRESA</label><select name="activityEmpresaId" defaultValue={autoCompanyId}><option value="">-- SIN EMPRESA --</option>{db.empresas.map(e=><option key={e.id} value={e.id}>{e.nombre}</option>)}</select>
       <label>CONTACTO</label><select name="contactoId" defaultValue={contextContactId}><option value="">-- SIN CONTACTO --</option>{activityContacts.map(c=><option key={c.id} value={c.id}>{c.nombre} // {emp(c.empresaId)?.nombre}</option>)}</select>
       {activityOppContext&&<div className="small" style={{marginTop:"-6px",marginBottom:"8px"}}>{activityContacts.length?`${activityContacts.length} CONTACTO${activityContacts.length===1?"":"S"} ASOCIADO${activityContacts.length===1?"":"S"} A ESTA OPORTUNIDAD`:"ESTA OPORTUNIDAD NO TIENE CONTACTOS ASOCIADOS"}</div>}
       <label>OPORTUNIDAD</label><select name="oportunidadId" defaultValue={autoOppId}><option value="">-- SIN OPORTUNIDAD --</option>{orderedOpps.map(o=><option key={o.id} value={o.id}>{emp(o.empresaId)?.nombre} // {o.nombre}</option>)}</select>
       <label>INICIATIVA COMERCIAL</label><select name="iniciativaId" defaultValue={a?.iniciativaId||modal.initiative||autoOpp?.iniciativaId||""}><option value="">-- SIN INICIATIVA --</option>{(db.iniciativas||[]).filter(i=>i.estado==="Activa"&&(!autoCompanyId||i.empresaId===autoCompanyId||i.cuentas.some(c=>c.empresaId===autoCompanyId))).map(i=><option key={i.id} value={i.id}>{i.tipo} // {i.nombre}</option>)}</select><div className="small" style={{marginTop:"-6px",marginBottom:"8px"}}>OPCIONAL // IDENTIFICA QUÉ ESTRATEGIA COMERCIAL ORIGINÓ ESTA ACTIVIDAD.</div>
       <label>FECHA</label><input name="fecha" type="date" defaultValue={a?.fecha||today} required/>
       <label>RESULTADO / NOTA</label><textarea name="nota" defaultValue={a?.nota||""} placeholder="> ¿Qué pasó?"></textarea>
       <label>PRÓXIMA ACCIÓN</label><input name="accion" defaultValue={a?linkedOpp?.proxima||"":""} placeholder="Ej: Seguimiento propuesta"/>
       <label>FECHA PRÓXIMA ACCIÓN</label><input name="proximo" type="date" defaultValue={a?linkedOpp?.fecha||"":""}/>
       {a&&<div className="card"><label style={{margin:"0",color:"var(--amber)"}}><input style={{width:"auto",marginRight:"8px"}} type="checkbox" name="updateNext" value="yes"/>ACTUALIZAR TAMBIÉN LA PRÓXIMA ACCIÓN DE LA OPORTUNIDAD</label><div className="meta">DESMARCADO = SOLO CORRIGE EL REGISTRO HISTÓRICO.</div></div>}
       <div className="actions"><button className="btn primary" type="submit">{a?"GUARDAR CAMBIOS":"GUARDAR"}</button>{a&&<button className="btn danger" type="button" onClick={()=>deleteActivity(a.id)}>ELIMINAR</button>}<button className="btn dim" type="button" onClick={()=>setModal(false)}>CANCELAR</button></div>
      </form></>
    })()}</>}
   </div></div>}
  {dialog&&<div className="overlay" style={{zIndex:120}} onClick={()=>setDialog(null)}>
    <div className="modal" style={{maxWidth:"520px",alignSelf:"center"}} onClick={e=>e.stopPropagation()}>
      <div className="section-title"><span>&gt; {dialog.title}</span><button className="btn dim" onClick={()=>setDialog(null)}>ESC</button></div>
      {dialog.custom ? dialog.body : <>
       <div className="card"><div style={{lineHeight:"1.55"}}>{dialog.message}</div></div>
       <div className="actions">
        {dialog.type==="confirm"&&<button className="btn danger" onClick={dialog.onConfirm}>CONFIRMAR</button>}
        <button className="btn primary" onClick={()=>setDialog(null)}>{dialog.type==="confirm"?"CANCELAR":"ACEPTAR"}</button>
       </div>
      </>}
    </div>
  </div>}
 </div>
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>

<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("./sw.js").catch(err => {
      console.warn("MiniCRM Service Worker:", err);
    });
  });
}
</script>

</body></html>
